name: Short Squeeze Watchlist

on:
  schedule:
    # Daily at 02:00 UTC (after FINRA publishes T+1 file ~midnight ET)
    - cron: '0 2 * * 1-6'

  workflow_dispatch:

jobs:
  scan-short-squeezes:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run short squeeze watchlist scanner
        env:
          AT_API: ${{ secrets.AT_API }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python short_squeeze_watchlist.py
